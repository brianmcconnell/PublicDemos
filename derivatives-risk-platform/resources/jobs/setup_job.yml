resources:
  jobs:
    setup:
      name: "[${bundle.target}] risk-platform-setup"
      tags:
        project: derivatives-risk-platform
      # The step .py files are workspace FILES, which notebook_task cannot run; run_step execs them with
      # dbutils.widgets backed by --param key=value (same pattern as risk_daily).
      tasks:
        - task_key: setup
          spark_python_task:
            python_file: ../../src/jobs/run_step.py
            parameters: ["--step", "00_setup.py", "--param", "catalog=${var.catalog}", "--param", "schema=${var.schema}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "6"
            dependencies:
              - QuantLib
