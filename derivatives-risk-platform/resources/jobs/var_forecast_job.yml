resources:
  jobs:
    var_forecast:
      name: "[${bundle.target}] risk-platform-var-forecast"
      tags:
        project: derivatives-risk-platform
      max_concurrent_runs: 1
      schedule:
        # Train weekly on Monday morning: a fresh week of actuals is available; model is ready for the week
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: America/New_York
        pause_status: ${var.daily_schedule_status}
      tasks:
        - task_key: train_var_forecast
          spark_python_task:
            python_file: ../../src/jobs/run_step.py
            parameters:
              - "--step"
              - "16_var_forecast_automl.py"
              - "--param"
              - "catalog=${var.catalog}"
              - "--param"
              - "schema=${var.schema}"
              - "--param"
              - "horizon_days=10"
          environment_key: forecast
          timeout_seconds: 5400
      environments:
        - environment_key: forecast
          spec:
            environment_version: "6"
            dependencies:
              - scikit-learn>=1.3
              - mlflow>=2.14

    var_monitor:
      name: "[${bundle.target}] risk-platform-var-monitor"
      tags:
        project: derivatives-risk-platform
      max_concurrent_runs: 1
      schedule:
        # Monitor weekly on Wednesday: gives 2 days of actuals since the Monday retrain to score
        quartz_cron_expression: "0 0 7 ? * WED"
        timezone_id: America/New_York
        pause_status: ${var.daily_schedule_status}
      tasks:
        - task_key: monitor_var_forecast
          spark_python_task:
            python_file: ../../src/jobs/run_step.py
            parameters:
              - "--step"
              - "17_var_forecast_monitor.py"
              - "--param"
              - "catalog=${var.catalog}"
              - "--param"
              - "schema=${var.schema}"
              - "--param"
              - "eval_days=21"
              - "--param"
              - "max_degradation=0.10"
          environment_key: forecast
          timeout_seconds: 5400
      environments:
        - environment_key: forecast
          spec:
            environment_version: "6"
            dependencies:
              - scikit-learn>=1.3
              - mlflow>=2.14
